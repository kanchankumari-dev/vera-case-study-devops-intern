name: Security Scan

on: [push]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for secrets with Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          cat > /tmp/gitleaks.toml <<'EOF'
          title = "Vera Case Study Gitleaks Rules"

          [[rules]]
          id = "hardcoded-api-key"
          description = "Hard-coded API key"
          regex = '''(?i)API_KEY\s*=\s*["'][^"']+["']'''
          keywords = ["API_KEY"]
          EOF

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "/tmp/gitleaks.toml:/config.toml" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --no-git \
            --config /config.toml \
            --no-banner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan dependencies with pip-audit
        id: pip-audit
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

      - name: Fail if security issues were found
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" != "success" ]; then
            echo "Gitleaks found a secret."
            exit 1
          fi

          if [ "${{ steps.pip-audit.outcome }}" != "success" ]; then
            echo "pip-audit found vulnerable dependencies."
            exit 1
          fi